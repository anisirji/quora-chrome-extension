<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 520px; max-height: 580px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f1117; color: #e0e0e0; overflow-y: auto; }
  .header { padding: 16px; border-bottom: 1px solid #1e2130; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 1rem; color: #fff; }
  .header-actions { display: flex; gap: 8px; }

  .stats { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; }
  .stat { background: #1a1d27; border: 1px solid #2a2d37; border-radius: 6px; padding: 8px 14px; flex: 1; min-width: 70px; text-align: center; }
  .stat-label { font-size: 0.65rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 1.2rem; font-weight: 700; margin-top: 2px; }

  .controls { padding: 8px 16px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type="text"] { background: #1a1d27; border: 1px solid #2a2d37; color: #e0e0e0; padding: 6px 10px; border-radius: 5px; font-size: 0.8rem; outline: none; }
  select:focus, input:focus { border-color: #6ea8fe; }
  input[type="text"] { flex: 1; min-width: 120px; }

  .btn { border: none; padding: 6px 14px; border-radius: 5px; font-size: 0.78rem; cursor: pointer; font-weight: 600; transition: background 0.15s; }
  .btn-primary { background: #1a3a5c; color: #6ea8fe; border: 1px solid #2a5a8c; }
  .btn-primary:hover { background: #1f4a7a; }
  .btn-success { background: #0a3622; color: #75d99a; border: 1px solid #1a5a3a; }
  .btn-success:hover { background: #0f4a2e; }
  .btn-warning { background: #3d3200; color: #ffc107; border: 1px solid #5a4a00; }
  .btn-warning:hover { background: #4a3d00; }
  .btn-danger { background: #3d0a0a; color: #ff6b6b; border: 1px solid #5a1a1a; }
  .btn-danger:hover { background: #4a1212; }
  .btn-sm { padding: 4px 8px; font-size: 0.7rem; }
  .btn-icon { background: none; border: none; color: #888; cursor: pointer; font-size: 1rem; padding: 4px; }
  .btn-icon:hover { color: #fff; }

  .entries { padding: 0 16px 16px; }
  .entry { background: #1a1d27; border: 1px solid #2a2d37; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; }
  .entry-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .entry-title { font-size: 0.82rem; color: #e0e0e0; flex: 1; line-height: 1.3; }
  .entry-title a { color: #6ea8fe; text-decoration: none; }
  .entry-title a:hover { text-decoration: underline; }
  .entry-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
  .entry-actions { display: flex; gap: 4px; margin-top: 6px; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; }
  .badge-pending { background: #3d3200; color: #ffc107; }
  .badge-answered { background: #002b5c; color: #6ea8fe; }
  .badge-posted { background: #0a3622; color: #75d99a; }
  .badge-failed { background: #3d0a0a; color: #ff6b6b; }

  .answer-preview { font-size: 0.75rem; color: #999; margin-top: 6px; padding: 6px 8px; background: #12141c; border-radius: 4px; max-height: 60px; overflow-y: auto; line-height: 1.4; white-space: pre-wrap; }

  .empty { text-align: center; padding: 40px 16px; color: #555; font-size: 0.85rem; }
  .loading { text-align: center; padding: 40px 16px; color: #888; font-size: 0.85rem; }
  .toast { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); padding: 8px 20px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; z-index: 999; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast-success { background: #0a3622; color: #75d99a; border: 1px solid #1a5a3a; }
  .toast-error { background: #3d0a0a; color: #ff6b6b; border: 1px solid #5a1a1a; }
</style>
</head>
<body>

<div class="header">
  <h1>Quora Growth Bot</h1>
  <div class="header-actions">
    <button class="btn btn-primary" id="extractBtn" title="Extract questions from Google">Extract</button>
    <button class="btn btn-warning" id="generateAllBtn" title="Generate AI answers for all pending">Generate All</button>
    <button class="btn-icon" id="settingsBtn" title="Settings">&#9881;</button>
    <button class="btn-icon" id="refreshBtn" title="Refresh">&#8635;</button>
  </div>
</div>

<div class="stats" id="stats"></div>

<div class="controls">
  <select id="statusFilter">
    <option value="all">All</option>
    <option value="pending">Pending</option>
    <option value="answered">Answered</option>
    <option value="posted">Posted</option>
    <option value="failed">Failed</option>
  </select>
  <input type="text" id="searchBox" placeholder="Search questions...">
</div>

<div class="entries" id="entries">
  <div class="loading">Connecting to database...</div>
</div>

<div class="toast" id="toast"></div>

<script src="popup.js"></script>
</body>
</html>
